name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# The images are what the ZimaOS host pulls. They are tagged three ways:
#   :main   — what the host normally runs, so a redeploy is `pull` with no edit
#   :<sha>  — an exact, immutable reference to roll back to
#   :latest — convenience only
# Deploy stays a deliberate manual pull-and-restart. You choose when the thing
# holding your passport restarts.
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bindery
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bindery_test
        options: >-
          --health-cmd "pg_isready -U bindery"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+asyncpg://bindery:ci@localhost:5432/bindery_test
      DATA_ROOT: /tmp/bindery-test-data
      JWT_SECRET: ci-only-not-a-real-secret
      COOKIE_SECURE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # `test_docs.py` asks git when a screen last changed, to catch a
          # documentation screenshot that is quietly out of date. A shallow
          # clone has no history to ask, and the check would pass by knowing
          # nothing — which is exactly the failure mode it exists to prevent.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python infra/extract-deps.py dev > requirements.txt
          pip install -r requirements.txt
      - name: Lint
        run: ruff check api worker tests
      - name: Test
        # The default run excludes `live_api` and `slow`, so CI never makes a
        # billable API call and never needs the OCR toolchain.
        run: python -m pytest

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          # Every Dockerfile names its shipped stage `runtime`. Stating it is
          # what stops the api and worker images shipping their `dev` stage,
          # which carries the test harness and the whole source tree.
          target: runtime
          # Derived from the build, never hand-maintained (REQ-152). A version
          # somebody has to remember to bump is a version that is wrong, and
          # "which code is actually running" is the first question of every
          # production problem.
          build-args: |
            BINDERY_COMMIT=${{ github.sha }}
            BINDERY_BUILT_AT=${{ github.event.repository.updated_at }}
            BINDERY_REF=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
