name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, and not only for tidiness. Two things here only move on a schedule:
  # `pip-audit` and `npm audit` are checks against advisory databases that change
  # without this repository changing, and the published images are rebuilt against
  # current base-image OS packages. Without this, a CVE disclosed on Tuesday is
  # noticed whenever somebody next happens to push.
  schedule:
    - cron: "17 5 * * 1"

# Five gates, in order, and nothing is published until all five pass.
#
#   lint  →  unit  →  integration  →  e2e  →  images
#
# Sequential on purpose. Running them in parallel would finish sooner and would
# also spend a full e2e run — build three images, stand up Postgres, seed a
# corpus, drive a browser — to tell you about a lint error. The gates are
# ordered cheapest-first so the common failure is also the fastest one.
#
# `actions/checkout` v5 and `setup-python` v6 run on Node 24. The v4/v5 pair
# targeted Node 20, which GitHub now force-upgrades and warns about on every
# run — a warning on every green build is one nobody reads.
#
# Every `uses:` names a full commit SHA, with the version it was in a trailing
# comment. `v5` and `v6` are branch-like refs the action's owner can repoint at
# any commit, and the `images` job below holds `packages: write` and hands
# `docker/build-push-action` a live ghcr token — so a rewritten tag is
# attacker-controlled code inside a runner that can publish the images this
# household's archive pulls, with nobody reviewing a line of Bindery's source.
# That is not hypothetical; it is what happened to tj-actions. First-party
# `actions/` and `docker/` are lower risk, not no risk.
#
# Do not "simplify" one back to a tag. `.github/dependabot.yml` bumps these
# weekly and rewrites the comment with the SHA, so the pins stay current on
# their own; a test asserts every `uses:` is a 40-character SHA.

jobs:
  lint:
    name: lint (ruff, eslint, tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install python tooling
        # `-c requirements.lock` here for the same reason the Dockerfiles use it:
        # otherwise this gate lints and tests one resolution while the `images`
        # job publishes another, and a green pipeline says nothing about the
        # artifact it produced.
        run: |
          python infra/extract-deps.py dev > requirements.txt
          pip install -c requirements.lock -r requirements.txt
      - name: ruff
        run: ruff check api worker tests
      - name: api contract
        # The wire contract is written twice by hand: 123 Pydantic models in
        # api/schemas.py and 96 TypeScript interfaces mirroring them in
        # web/src/api.ts. `tsc --noEmit` below proves the client agrees with
        # itself, not that it agrees with the server, so a renamed or narrowed
        # response field used to pass all four gates and arrive in the browser as
        # `undefined` on whichever screen the e2e specs happen not to assert on.
        #
        # Here rather than in the unit gate because it is the cheapest check in
        # the pipeline — two files parsed on disk, no app, no database — and this
        # is the gate the sequencing argument above exists for (CR-059).
        run: python scripts/check_api_contract.py
      - name: mypy
        # Not a clean run: a ratchet against scripts/mypy-baseline.json. The
        # posture and the reason for it are in CLAUDE.md's Conventions section —
        # the defect (CR-089) was that mypy was a declared dev dependency with no
        # configuration, no invocation and nothing anywhere saying whether that
        # was deliberate.
        #
        # mypy's answer depends on which packages are installed, so this must
        # keep running with the base + `dev` groups and no `worker` extra, which
        # is what the step above installs and what the compose `test` service
        # carries. Any other environment and the diff is the environment.
        run: python scripts/typecheck.py
      - name: pip-audit
        # The whole locked closure, including the worker extra that this runner
        # does not install — the shipped images do, and this is the gate that
        # gets to know about them. `--no-deps` audits the pinned lines verbatim
        # rather than re-resolving; `--strict` fails rather than skipping a
        # package it could not look up, because a scanner that quietly examines
        # nothing is the badge that is always on.
        #
        # Blocking, not advisory: both ecosystems are clean as of this commit,
        # so there is no pre-existing failure to grandfather in, and an advisory
        # warning on a green build is one nobody reads.
        run: |
          pip install "pip-audit>=2.10,<3"
          pip-audit --strict --no-deps -r requirements.lock
      - name: Install web dependencies
        # `--no-audit` is deliberately gone. It suppressed the one report this
        # pipeline got for free; `npm audit` below is the gate, and this is
        # simply no longer opting out of hearing about it.
        working-directory: web
        run: npm ci --no-fund
      - name: npm audit
        # `high` and above fails. Moderate advisories in a dev-only build chain
        # are the noise that teaches people to ignore this step.
        #
        # Unlike `pip-audit`, which reads a lockfile we ship, this is a live
        # call to registry.npmjs.org from the *first* gate — so when that
        # endpoint returned 503, seven minutes of npm's own retries could not
        # clear it and a finished, four-gates-green release could not deploy.
        # The check could not tell "found a vulnerability" from "could not ask",
        # and failed closed on somebody else's uptime.
        #
        # An advisory still fails the build. An unreachable registry is a
        # warning: not knowing is worth saying out loud and is not worth
        # blocking a deploy of unrelated code. The weekly scheduled run asks
        # again, which is the thing that actually catches a CVE disclosed
        # between pushes.
        working-directory: web
        run: |
          set +e
          report=$(npm audit --audit-level=high --json 2>/dev/null)
          status=$?
          set -e
          # A real report always carries `metadata`; a transport failure carries
          # `error` and nothing else. That is the whole distinction, and npm's
          # exit code alone does not make it — it is non-zero for both.
          if ! printf '%s' "$report" | grep -q '"metadata"'; then
            echo "::warning::npm audit could not reach the registry — advisories were NOT checked on this run."
            printf '%s\n' "$report" | head -5
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$report"
            echo "::error::npm audit found advisories at high or above"
            exit 1
          fi
          echo "npm audit: no advisories at high or above"
      - name: eslint
        working-directory: web
        # --max-warnings 0: a warning nobody has to fix is the same trap as a
        # badge that is always on.
        run: npm run lint
      - name: tsc
        working-directory: web
        # The app and the e2e specs. Previously the only typecheck was `tsc -b`
        # inside Dockerfile.web, which runs *after* the tests — so a type error
        # failed the image build as an opaque Docker error rather than here.
        run: npm run typecheck

      - name: vitest
        working-directory: web
        # The frontend unit suite (CR-123). It belongs in the lint gate rather
        # than beside pytest: it needs no database and no browser, so running it
        # here keeps the cheapest gate first and stops a broken component
        # reaching the e2e job's three image builds.
        run: npm test

  unit:
    name: unit (pytest)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bindery
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bindery_test
        options: >-
          --health-cmd "pg_isready -U bindery"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+asyncpg://bindery:ci@localhost:5432/bindery_test
      DATA_ROOT: /tmp/bindery-test-data
      JWT_SECRET: ci-only-not-a-real-secret
      COOKIE_SECURE: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # `test_docs.py` asks git when a screen last changed, to catch a
          # documentation screenshot that is quietly out of date. A shallow
          # clone has no history to ask, and the check would pass by knowing
          # nothing — which is exactly the failure it exists to prevent.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install
        # Under the lock, so the suite tests the resolution the images ship.
        run: |
          python infra/extract-deps.py dev > requirements.txt
          pip install -c requirements.lock -r requirements.txt
      - name: pytest
        # The default run excludes `live_api` and `slow`, so this never makes a
        # billable API call and never needs the OCR toolchain.
        run: python -m pytest

  integration:
    name: integration (OCR, golden corpus)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Run the slow suite in the worker image
        # The OCR toolchain — tesseract, ghostscript, LibreOffice — only exists
        # in the worker image, so this tier runs where its dependencies are
        # rather than reinstalling several hundred megabytes onto the runner.
        run: |
          # The same coherent .env as the e2e job, for the same reason: every
          # service must read one set of values, not two files that agree by
          # coincidence.
          cat > .env <<'ENV'
          POSTGRES_USER=bindery
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=bindery
          DATABASE_URL=postgresql+asyncpg://bindery:ci@postgres:5432/bindery
          JWT_SECRET=ci-only-not-a-real-secret
          COOKIE_SECURE=false
          HOST_DATA_ROOT=/tmp/bindery-ci-data
          DATA_ROOT=/data
          INBOX_ROOT=/data/inbox
          WORKER_CONCURRENCY=2
          OCR_LANGUAGES=eng
          ENV
          mkdir -p /tmp/bindery-ci-data/inbox/household
          docker compose --env-file .env -f infra/docker-compose.yml \
            --profile test run --rm test-worker \
            python -m pytest -m slow --no-header

  e2e:
    name: e2e (playwright)
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Write a coherent .env
        # Not `cp .env.example .env`. Compose interpolates `${POSTGRES_PASSWORD}`
        # from the *shell* environment, so Postgres came up with `ci` while the
        # api read DATABASE_URL out of the copied example and got the template's
        # password — "password authentication failed for user bindery", from two
        # files that each looked right on their own.
        #
        # One file, written once, and every service reads the same values.
        run: |
          cat > .env <<'ENV'
          POSTGRES_USER=bindery
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=bindery
          DATABASE_URL=postgresql+asyncpg://bindery:ci@postgres:5432/bindery
          JWT_SECRET=ci-only-not-a-real-secret
          JWT_ACCESS_TTL_MINUTES=30
          JWT_REFRESH_TTL_DAYS=30
          COOKIE_SECURE=false
          HOST_DATA_ROOT=/tmp/bindery-ci-data
          DATA_ROOT=/data
          INBOX_ROOT=/data/inbox
          WORKER_CONCURRENCY=2
          OCR_LANGUAGES=eng
          OCR_DESKEW=true
          OCR_CLEAN=true
          ENV
          mkdir -p /tmp/bindery-ci-data/inbox/household
          # The api and worker runtime images run as uid 10001 (see
          # infra/Dockerfile.api). The runner creates this tree as itself, so
          # without this the containers come up healthy and fail on the first
          # write — which is exactly the failure the deploy runbook's step 3
          # tells the operator to prevent on the real host. Same command, so
          # this gate exercises it.
          sudo chown -R 10001:10001 /tmp/bindery-ci-data
      - name: Stand up the stack
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml up -d --build
        # Repeated rather than a YAML anchor: Actions parses anchors but does
        # not support merge keys, and `<<:` fails the whole workflow file.
      - name: Migrate
        # Explicitly, never on boot (REQ-114) — the same way a real deploy does
        # it, so this exercises the path that is actually used.
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml exec -T api \
            alembic upgrade head
          docker compose --env-file .env -f infra/docker-compose.yml exec -T api \
            python -m api.cli seed-forms
      - name: Create the throwaway account
        # Generated per run rather than committed. A password in the repository
        # is a password in the repository whatever the file is called.
        run: |
          echo "BINDERY_PASSWORD=Grebulon-Verdant-$(openssl rand -hex 6)" >> "$GITHUB_ENV"
      - name: Create the account the fixtures belong to
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml exec -T api \
            python -m api.cli create-user --email demo@example.com \
            --password "$BINDERY_PASSWORD" --library "Demo Papers"
      - name: Seed the corpus
        # After the account exists: seed-demo ingests into that user's library.
        run: |
          # Piped in rather than run from the image. The api runtime stage
          # ships `api/` and `alembic/` and deliberately not `scripts/` — only
          # the `dev` stage carries the whole tree — so `python scripts/...`
          # inside that container is a file-not-found. `python -` reads stdin.
          docker compose --env-file .env -f infra/docker-compose.yml exec -T api \
            python - < scripts/seed-demo.py
          # And the two job states the pipeline specs check. Without them those
          # tests skip, and a test that always skips is not a test.
          docker compose --env-file .env -f infra/docker-compose.yml exec -T \
            -e BINDERY_EMAIL=demo@example.com api \
            python - < scripts/seed-e2e-states.py

      - name: Wait for the pipeline to finish the seeded corpus
        # Seeding *ingests*; OCR, paging and segmentation happen afterwards in
        # the worker. Locally the fixtures have been processed for hours, so
        # this was invisible — in CI the browser arrived seconds after the
        # upload and found documents that were not yet searchable. Two specs
        # failed on that and one passed, because it matched on text rather than
        # on a link.
        #
        # CR-126. It is a gate, not a pause. Two ways it used to pass on a
        # pipeline that had not run: the loop fell out on exhaustion and the job
        # carried on, and the count read only `queued`/`running`, so a worker
        # dead-lettering every job satisfied `pending = 0` on the first poll.
        # Either way the next tier went red with a retrieval-shaped Playwright
        # failure pointing at the wrong subsystem — or passed, on an archive
        # whose pipeline never ran. The summary below used to be printed and
        # never read; now it is asserted on.
        #
        # `classify` is excluded, and that is not a loophole. There is no
        # ANTHROPIC_API_KEY in CI and there never will be — retrieval must not
        # depend on the Claude API (invariant 7), so a classify job with no
        # provider retries forever *without counting an attempt*, by design
        # (REQ-055). It is permanently `queued` and draining is not a state it
        # can reach. Asserting otherwise made this gate demand a condition the
        # architecture forbids, which is how it failed on its first real run.
        # What can still be caught is a classify job that *failed* rather than
        # deferred: the unexpected-failures check below covers every stage.
        run: |
          drained=
          for i in $(seq 1 60); do
            pending=$(docker compose --env-file .env -f infra/docker-compose.yml \
              exec -T postgres psql -U bindery -d bindery -tAc \
              "select count(*) from job
                where state in ('queued','running') and stage <> 'classify'" | tr -d '[:space:]')
            echo "  in flight: $pending"
            if [ "$pending" = "0" ]; then drained=yes; break; fi
            sleep 5
          done
          # Said out loud rather than left implicit, so a reader of this log can
          # see the deferral is expected and how much of it there is.
          deferred=$(docker compose --env-file .env -f infra/docker-compose.yml \
            exec -T postgres psql -U bindery -d bindery -tAc \
            "select count(*) from job
              where state = 'queued' and stage = 'classify'" | tr -d '[:space:]')
          echo "  classify deferred, waiting on a provider that CI does not have: $deferred"
          docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres \
            psql -U bindery -d bindery -c \
            "select state, count(*) from job group by state order by 1;"
          if [ -z "$drained" ]; then
            echo "::error::the pipeline did not drain in 5 minutes"
            exit 1
          fi
          # The only jobs allowed to be unhealthy are the two
          # scripts/seed-e2e-states.py deliberately plants — one declined and
          # one dead-lettered, on invented filenames the pipeline specs exist to
          # check. Excluded by name rather than by count, so a real failure that
          # happens to arrive alongside them still fails this step.
          unexpected=$(docker compose --env-file .env -f infra/docker-compose.yml \
            exec -T postgres psql -U bindery -d bindery -tAc \
            "select count(*) from job j
               left join source_file f on f.id = j.source_file_id
              where j.state in ('failed', 'dead_letter', 'declined')
                and coalesce(f.original_filename, '') not in
                    ('scan-that-timed-out.pdf', 'laser-cutting-asset.png')" | tr -d '[:space:]')
          echo "  unexpected failures: $unexpected"
          if [ "$unexpected" != "0" ]; then
            docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres \
              psql -U bindery -d bindery -c \
              "select j.state, j.stage, f.original_filename, j.last_error
                 from job j left join source_file f on f.id = j.source_file_id
                where j.state in ('failed', 'dead_letter', 'declined')
                order by 1, 3;"
            echo "::error::the pipeline failed jobs the seed did not plant"
            exit 1
          fi

      - name: Playwright
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml \
            --profile e2e run --rm e2e
        env:
          BINDERY_EMAIL: demo@example.com
          CI: "true"

      - name: Back up the seeded archive
        # The ordering rule, run for real: integrity check, then `pg_dump`, then
        # blobs (REQ-096). This is `make backup` without the Makefile, and it is
        # here rather than in its own job because the drill below needs the
        # generation it writes and the corpus this job seeded.
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml exec -T api \
            python -m api.export.cli backup

      - name: Restore drill — the deliverable (REQ-097)
        # CR-041. "The restore drill is the deliverable, not the backup" — and
        # nothing had ever run it. A unit test read the script as text and
        # asserted six substrings were present, every one of which survives a
        # script whose control flow is broken.
        #
        # This restores the dump this job just took into a genuinely empty
        # Postgres, checks every original the restored database references is in
        # the backup beside it, and searches the restored data for a term the
        # seeded corpus contains — the same term web/e2e/search.spec.ts uses,
        # so the two fail together rather than one quietly drifting.
        #
        # pgvector rather than the script's default postgres:16-alpine: the
        # dump's tables use the `vector` type and the plain image has no such
        # extension to create. The image is already pulled by the stack above.
        env:
          PG_IMAGE: pgvector/pgvector:pg16
        run: |
          generation=$(ls -1d /tmp/bindery-ci-data/backups/*/ | sort | tail -1)
          echo "drilling $generation"
          bash scripts/restore-drill.sh "$generation" Northwood

      - name: Restore drill — proven able to fail
        # A drill that cannot fail is a ceremony. The same generation with one
        # original removed has to be refused: `pg_restore` returning zero says
        # nothing about the blob pool beside the dump, and this is the check
        # that does.
        env:
          PG_IMAGE: pgvector/pgvector:pg16
        run: |
          generation=$(ls -1d /tmp/bindery-ci-data/backups/*/ | sort | tail -1)
          sudo cp -a "$generation" /tmp/bindery-broken-generation
          sudo chown -R "$(id -u):$(id -g)" /tmp/bindery-broken-generation
          victim=$(find /tmp/bindery-broken-generation/blobs -type f | head -1)
          [ -n "$victim" ] || { echo "the backup held no originals to remove"; exit 1; }
          echo "removing $victim"
          rm -f "$victim"
          if bash scripts/restore-drill.sh /tmp/bindery-broken-generation Northwood \
               > drill-negative.log 2>&1; then
            echo "the drill passed over a backup missing an original — it cannot fail"
            cat drill-negative.log
            exit 1
          fi
          grep -q "MISSING BLOB" drill-negative.log
          echo "the drill refused an incomplete backup, as it must"

      - name: What the stack said, if it failed
        if: failure()
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml logs --tail 120 api worker web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  images:
    name: publish
    needs: e2e
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          # Every Dockerfile names its shipped stage `runtime`. Stating it is
          # what stops the api and worker images shipping their `dev` stage,
          # which carries the test harness and the whole source tree.
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The dependency layer's cache key is the content hash of
          # pyproject.toml and requirements.lock, so an ordinary push reuses it
          # and a dependency change busts it — which is what we want, and what
          # was missing while there was no lock to hash.
          #
          # It still cannot pick up a base-image OS patch, because nothing about
          # `FROM python:3.13-slim` changes when Debian publishes one. So the
          # weekly run rebuilds from scratch. It republishes the same tags for
          # the same commit, deliberately: same source, current packages.
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}
          # Derived from the build, never hand-maintained (REQ-152). A version
          # somebody has to remember to bump is a version that is wrong, and
          # "which code is actually running" is the first question of every
          # production problem.
          build-args: |
            BINDERY_COMMIT=${{ github.sha }}
            BINDERY_BUILT_AT=${{ github.event.repository.updated_at }}
            BINDERY_REF=${{ github.ref_name }}
