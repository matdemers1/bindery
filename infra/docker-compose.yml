# Bindery — see D3 Cloud Vault/Bindery/Architecture.md
# INVARIANT (REQ-104): no service publishes a host port. Ingress is Cloudflare
# Tunnel only (ADR-006). Do not add a `ports:` key to anything in this file.
#
# Every long-running service carries a `logging:` block. Docker's default
# json-file driver keeps every line forever, and on this deployment the Docker
# data root shares a device with `pgdata` — so unbounded uvicorn access logs and
# per-stage worker lines eventually stop Postgres being able to write, and the
# archive presents at 3am as a database that will not start rather than as
# "your logs are large". 20m x 5 is 100 MB a service, ceiling included. The
# `event_log` table is the deliberately unpruned record (invariant 3); container
# stdout is the same text with none of the provenance.
#
# `stop_grace_period` is on the same services for the mirror-image reason. Docker
# SIGKILLs ten seconds after SIGTERM by default, and `worker/runner.py` gives
# in-flight work `SHUTDOWN_GRACE_SECONDS` (20s) before handing its claims back —
# so with the default every deploy killed the worker mid-job, the claims were
# never released, and the jobs sat `running` until their lease expired. Keep each
# of these comfortably above the drain the process actually performs; a test
# asserts the relationship against worker/runner.py.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Postgres flushes and closes cleanly on SIGTERM. Ten seconds is usually
    # enough and is not enough to be sure, and an unclean shutdown means
    # recovery on the next start.
    stop_grace_period: 30s

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: runtime
    env_file: ../.env
    volumes:
      - ${HOST_DATA_ROOT}:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    # Above the api lifespan's own drain, so the `finally` block that flushes
    # the last event_log rows actually runs — those are the lines most likely to
    # explain whatever you were mid-way through when you redeployed.
    stop_grace_period: 20s
    # NOTE (REQ-114): migrations are NOT run here. Apply them explicitly.

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
      target: runtime
    env_file: ../.env
    volumes:
      - ${HOST_DATA_ROOT}:/data
    depends_on:
      postgres:
        condition: service_healthy
    # A wedged worker and an idle worker look identical from outside — `Up`, no
    # logs, nothing claimed — so this asks the one question that separates them:
    # is the event loop still turning? `worker/runner.py`'s heartbeat task
    # stamps the file every 15s; 120s is eight missed stamps. Stdlib only, so
    # the check cannot wedge on whatever wedged the worker.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; p='/tmp/bindery-worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 120 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    # Above runner.SHUTDOWN_GRACE_SECONDS, or SIGKILL lands while the worker is
    # still waiting on in-flight tasks and it never reaches the block that hands
    # its claims back — stranding a normalize job for its whole 45-minute lease
    # and paging you about a deploy you performed on purpose.
    stop_grace_period: 30s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api
    healthcheck:
      # 127.0.0.1, not localhost: the image resolves localhost to ::1 first.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # Ingress. Held behind a profile so the stack runs without a tunnel token:
  #   docker compose --profile tunnel up -d
  cloudflared:
    profiles: [tunnel]
    # Pinned, like everything else in this file. `--no-autoupdate` means the
    # binary never updates itself, so the tag is the only update path — and on
    # `:latest` an unrelated `docker compose pull` silently swaps the process
    # that terminates the only ingress to the archive, with no version recorded
    # anywhere and nothing to roll back to. Bump it deliberately; see
    # docs/zimaos-deploy.md, "Bumping cloudflared".
    image: cloudflare/cloudflared:2026.8.3
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    depends_on:
      - web
      - api

  # Test runner. Uses the dev image target and a separate database, so it never
  # touches the archive. Also behind a profile — it is not part of the stack.
  #   docker compose --profile test run --rm test
  test:
    profiles: [test]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
      DATA_ROOT: /tmp/bindery-test-data
      # `test_docs.py` runs `git log` to find a screenshot older than the screen
      # it shows. Git refuses a repository it does not own, which a bind mount
      # always is.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
    # Without these, `make test` runs whatever source was baked into the image
    # at build time and reports a pass on code you have already changed. A
    # green suite that tested the previous commit is worse than a red one.
    volumes:
      - ../api:/app/api:ro
      - ../worker:/app/worker:ro
      - ../tests:/app/tests:ro
      # infra/ for the same reason as the three above. A test that reads a
      # Dockerfile or a lifecycle rule would otherwise be reading the copy baked
      # into this image and reporting on a version of the repository that no
      # longer exists — which is exactly what happened to the guard asserting
      # the worker image can run pg_dump.
      - ../infra:/app/infra:ro
      - ../alembic:/app/alembic:ro
      # ruff and pytest read their config from here.
      - ../pyproject.toml:/app/pyproject.toml:ro
      # And the lock beside it, for the same reason as infra/: the supply-chain
      # guard asserts the Dockerfiles and the lock agree, and reading the copy
      # baked into this image would report on a repository that no longer
      # exists.
      - ../requirements.lock:/app/requirements.lock:ro
      # `test_readme.py` parses the Makefile and the workflow and checks the
      # README against them, so all three have to be *this* tree. Baked copies
      # would let the suite go green on a README that has already drifted —
      # which is the whole failure that guard exists to catch.
      - ../README.md:/app/README.md:ro
      - ../Makefile:/app/Makefile:ro
      - ../CLAUDE.md:/app/CLAUDE.md:ro
      # test_trust_and_export.py asserts on the restore drill's own contents.
      - ../scripts:/app/scripts:ro
      # The operator runbooks. `test_operability.py` asserts they no longer
      # describe a perimeter that was removed or an offsite copy that was built
      # — an assertion about *this* tree. Without the mount it read the copy
      # baked into the image and reported on documentation that no longer
      # exists, the same failure that put infra/ and requirements.lock here.
      - ../docs:/app/docs:ro
      # test_docs.py reads the guides, the routes they must cover, and the
      # screenshots. Only `web/src` and `web/public` — mounting all of `web`
      # would drag node_modules in for two directories.
      - ../web/src:/app/web/src:ro
      - ../web/public:/app/web/public:ro
      # Read-only, and only so the screenshot staleness check can ask git when
      # a screen last changed. Nothing in the suite writes here.
      - ../.git:/app/.git:ro
      # The supply-chain guard reads the workflow and dependabot.yml — that CI
      # installs under the lock, audits both ecosystems, and rebuilds on a
      # schedule are assertions about *this* tree, not about whichever copy was
      # baked into this image.
      - ../.github:/app/.github:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Pipeline and golden-corpus suites. Needs the OCR toolchain, so it is built
  # from the worker image rather than the api one.
  #   docker compose --profile test run --rm test-worker
  test-worker:
    profiles: [test]
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
      target: dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
      DATA_ROOT: /tmp/bindery-test-data
      # `test_docs.py` runs `git log` to find a screenshot older than the screen
      # it shows. Git refuses a repository it does not own, which a bind mount
      # always is.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
    # Same reason as `test`: the suite must run against the working tree.
    volumes:
      - ../api:/app/api:ro
      - ../worker:/app/worker:ro
      - ../tests:/app/tests:ro
      # infra/ for the same reason as the three above. A test that reads a
      # Dockerfile or a lifecycle rule would otherwise be reading the copy baked
      # into this image and reporting on a version of the repository that no
      # longer exists — which is exactly what happened to the guard asserting
      # the worker image can run pg_dump.
      - ../infra:/app/infra:ro
      - ../alembic:/app/alembic:ro
      # ruff and pytest read their config from here.
      - ../pyproject.toml:/app/pyproject.toml:ro
      # And the lock beside it, for the same reason as infra/: the supply-chain
      # guard asserts the Dockerfiles and the lock agree, and reading the copy
      # baked into this image would report on a repository that no longer
      # exists.
      - ../requirements.lock:/app/requirements.lock:ro
      # `test_readme.py` parses the Makefile and the workflow and checks the
      # README against them, so all three have to be *this* tree. Baked copies
      # would let the suite go green on a README that has already drifted —
      # which is the whole failure that guard exists to catch.
      - ../README.md:/app/README.md:ro
      - ../Makefile:/app/Makefile:ro
      - ../CLAUDE.md:/app/CLAUDE.md:ro
      # test_trust_and_export.py asserts on the restore drill's own contents.
      - ../scripts:/app/scripts:ro
      # Same reason as in `test`: the operator runbooks are asserted on.
      - ../docs:/app/docs:ro
      # Same reason as in `test`: the supply-chain guard reads the workflow.
      - ../.github:/app/.github:ro
    depends_on:
      postgres:
        condition: service_healthy

  # End-to-end tests (Playwright):
  #   docker compose --profile e2e run --rm e2e
  #
  # Same network trick as `screenshots`, and for the same two reasons: there
  # are no published ports (REQ-104), and the session cookie is `Secure`, so a
  # browser reaching the app over plain `http://web` discards it silently — the
  # login succeeds and every later request 401s while the screen sits on the
  # login form looking like a wrong password. `localhost` is the one origin
  # Chrome trusts without TLS.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /repo/web
    network_mode: "service:web"
    environment:
      BINDERY_URL: http://localhost
      BINDERY_EMAIL: ${BINDERY_EMAIL:-demo@example.com}
      BINDERY_PASSWORD: ${BINDERY_PASSWORD:-}
      CI: ${CI:-}
    volumes:
      - ..:/repo
    depends_on:
      web:
        condition: service_healthy
    # `npm ci` against the repo's lockfile, so the browsers in the image and
    # the @playwright/test that drives them stay the same version. A mismatch
    # fails with an executable-not-found several layers down.
    #
    # `--no-audit` stays *here* and nowhere else. The audit gate is in CI's lint
    # job, which runs long before this and fails the build; repeating it in the
    # middle of an e2e run would print the same report a second time, minutes
    # later, where it gates nothing.
    command:
      - sh
      - -c
      - |
        npm ci --no-audit --no-fund && npx playwright test

  # Documentation screenshots (T-11.2, REQ-149):
  #   docker compose --profile screenshots run --rm screenshots
  #
  # Inside the network rather than from the host, because there are no
  # published ports (REQ-104) and there is not going to be one for this. It
  # reaches `web` directly, which is also how CI runs it.
  screenshots:
    profiles: [screenshots]
    image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    working_dir: /repo
    # The browser shares the web container's network namespace, so the app is
    # at `http://localhost`. That is not cosmetic: the session cookie is
    # `Secure`, and a browser discards a Secure cookie delivered over plain
    # HTTP — the login succeeded, the cookie was dropped, and every subsequent
    # request came back 401 while the screen sat on the login form looking like
    # a wrong password. `localhost` is the one origin Chrome treats as
    # trustworthy without TLS.
    network_mode: "service:web"
    environment:
      BINDERY_URL: http://localhost
      BINDERY_EMAIL: ${BINDERY_EMAIL:-demo@example.com}
      BINDERY_PASSWORD: ${BINDERY_PASSWORD:-}
      # `git log` needs to trust a directory it does not own.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
    volumes:
      - ..:/repo
    depends_on:
      web:
        condition: service_healthy
    # The image ships the browsers under /ms-playwright but not the Python
    # binding, so install it here — pinned to the image's own version, because
    # a newer binding looks for a browser build the image does not have and
    # fails with an executable-not-found several layers down.
    command:
      - sh
      - -c
      - |
        pip install --quiet --break-system-packages playwright==1.62.0 \
          && python scripts/capture-screens.py

volumes:
  pgdata:

