# `Connection: upgrade` only when the client actually asked to upgrade —
# sending it unconditionally breaks ordinary keep-alive requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512M;   # scanner batches are large

        # /api/live is a WebSocket. Without the upgrade dance nginx answers the
        # handshake with a plain 200 and the socket never forms — and because
        # the dev server proxies WebSockets natively, that failure appears
        # *only* in the deployed stack.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # An idle socket only sends a heartbeat every 25s; the default 60s read
        # timeout would be fine, but a slow OCR upload on the same location
        # would not be.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
