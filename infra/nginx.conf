# `Connection: upgrade` only when the client actually asked to upgrade —
# sending it unconditionally breaks ordinary keep-alive requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The scheme the *browser* used, which is not the scheme this server sees. TLS is
# terminated at Cloudflare and the tunnel speaks plain http to this container, so
# `$scheme` is always `http` here and an absolute URL built from the request comes
# out wrong — which is how the first real Sign in with D3 Auth attempt sent
# `http://bindery.d3cloud.io/api/auth/oidc/callback` to a provider that had the
# https form registered, and was refused with `invalid_redirect_uri`.
#
# Taken from the header the tunnel sets, falling back to `$scheme` when there is
# no proxy in front — a local `make up` reached over plain http still describes
# itself honestly.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Text compresses about 4:1 and this origin was serving none of it. The
# archive is reached over a Cloudflare Tunnel, so every byte is a round trip
# through somebody else's network — and the app is a React SPA whose first
# paint waits on the whole JS bundle.
gzip on;
gzip_vary on;
# 1 KB: below that the header costs more than the saving.
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/manifest+json
    image/svg+xml;
# Deliberately not `gzip_static`: nothing in the build writes .gz beside the
# assets, so it would silently do nothing.

server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Docker's embedded DNS, named explicitly. Without a `resolver` and a
    # variable in `proxy_pass`, nginx resolves `api` once at configuration load
    # and caches that address for the life of the process — and Docker hands a
    # container a *new* IP whenever it is recreated. So re-pinning only the api
    # image (`up -d api`, or a `:sha-` rollback of one service, which is exactly
    # what you do under pressure) left this proxying to an address nothing
    # answers on: every /api/ request 502s while `docker ps` shows all five
    # containers `Up` and web's own healthcheck — which only fetches the static
    # index — still passing. Full deploys hid it, because CI republishes all
    # three images on every commit and web gets recreated too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # `$request_uri`, not `/api/`. Any variable in `proxy_pass` switches
        # nginx out of prefix-replacement mode and sends *only* the literal URI
        # written here — so `proxy_pass http://$api_upstream:8000/api/` would
        # forward every request as `/api/` with no path and no query string.
        # This location's prefix and the upstream's are the same, so passing the
        # request URI through whole is byte-for-byte what the static form did:
        # verified against an echo upstream for paths, query strings and
        # percent-encoded segments before it was written here.
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Without this the api cannot know it is behind TLS. It is honoured only
        # because uvicorn is started with --proxy-headers and told to trust this
        # network (infra/Dockerfile.api) — the header alone does nothing.
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        client_max_body_size 512M;   # scanner batches are large

        # /api/live is a WebSocket. Without the upgrade dance nginx answers the
        # handshake with a plain 200 and the socket never forms — and because
        # the dev server proxies WebSockets natively, that failure appears
        # *only* in the deployed stack.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # An idle socket only sends a heartbeat every 25s; the default 60s read
        # timeout would be fine, but a slow OCR upload on the same location
        # would not be.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite writes a content hash into every asset filename, so an asset that
    # is still referenced is byte-identical by construction and can never go
    # stale. Without this each one cost a conditional request and a 304 on
    # every cold load — cheap individually, and the whole point of hashing the
    # names is not to pay it.
    location /assets/ {
        # Re-included because this block sets a header of its own; see the
        # comment in that file. One Cache-Control, not `expires` *and*
        # `add_header` — those emit two lines, which is legal and reads like a
        # mistake.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        # `index.html` is the one file that must *not* be cached: it names the
        # hashed assets, so a stale copy points at a deployment that is gone.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
