# Bindery — ZimaOS / CasaOS custom app
#
# Paste this into ZimaOS → Apps → Custom Install → Import (YAML).
#
# Before you do, three things must already be true. Each is a one-time step and
# each is in docs/zimaos-deploy.md:
#   1. Images have been pulled. NOTE: ZimaOS sets HOME=/DATA for your shell but
#      HOME=/root for services, and / is a read-only squashfs — so `docker login`
#      writes /DATA/.docker/config.json which the daemon never reads. Pull with:
#          DOCKER_CONFIG=/DATA/.docker docker compose pull
#   2. The directories below exist on the 16 TB pool.
#   3. Every `change-me` in the environment blocks has been replaced.
#
# INVARIANT (REQ-104): no service publishes a host port. Ingress is Cloudflare
# Tunnel only (ADR-006). Do not add a `ports:` key to anything here — the whole
# archive would become reachable from the LAN with no Access in front of it.
#
# Storage layout — deliberately split across two devices:
#
#   /media/Main-Storage/bindery/data   blobs, derived artifacts, inbox, exports
#                                      11 TB btrfs on RAID 5 across four disks.
#                                      The irreplaceable bytes live here because
#                                      this array survives a disk failure (R-09).
#
#   /DATA/AppData/bindery/pgdata       the database, on NVMe for IOPS. Not
#                                      redundant, but fully reconstructible from
#                                      the nightly pg_dump, which lands on the
#                                      RAID array.
#
# `/DATA` on ZimaOS is a 904 GB NVMe partition, NOT the storage pool. Putting the
# archive there would leave every original on a single disk.
#
# Two settings repeated on every service, and neither is tidiness:
#
#   logging:            Docker's default json-file driver keeps every line until
#                       the disk is full, and on this host the Docker data root
#                       is on `/DATA` — the same 904 GB NVMe as `pgdata`. So
#                       uvicorn's access log and the worker's per-stage lines
#                       eventually stop Postgres being able to write, and the
#                       archive presents at 3am as a database that will not
#                       start rather than as "your logs are large". Capped at
#                       20 MB x 5 per service. The `event_log` table is the
#                       record that is deliberately kept (invariant 3); this is
#                       the same text with none of the provenance.
#
#   stop_grace_period:  Docker SIGKILLs ten seconds after SIGTERM by default.
#                       `worker/runner.py` gives in-flight work 20 seconds and
#                       then hands its claims back, so with the default that
#                       block never ran: every `docker compose up -d` killed the
#                       worker mid-job and the jobs sat `running` until their
#                       lease expired — up to 45 minutes for normalize, at which
#                       point the health panel pages you about a deploy you
#                       performed on purpose. Repeated per service rather than
#                       anchored, because the CasaOS importer already struggles
#                       with the one anchor in this file.

name: bindery

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bindery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bindery
      POSTGRES_PASSWORD: change-me-strong-database-password
      POSTGRES_DB: bindery
      # Checksums catch bit rot on the way out of the pool rather than on the
      # way into a backup (R-09).
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /DATA/AppData/bindery/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bindery -d bindery"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    # Postgres flushes and closes cleanly on SIGTERM; ten seconds is enough for
    # a household-sized archive, but not enough to be sure, and an unclean
    # shutdown means recovery on the next start.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G

  api:
    image: ghcr.io/matdemers1/bindery/api:main
    container_name: bindery-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &bindery-env
      DATABASE_URL: postgresql+asyncpg://bindery:change-me-strong-database-password@postgres:5432/bindery
      # openssl rand -base64 48
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_ACCESS_TTL_MINUTES: "30"
      JWT_REFRESH_TTL_DAYS: "30"
      # Cloudflare terminates TLS, so the browser always speaks https.
      COOKIE_SECURE: "true"
      DATA_ROOT: /data
      INBOX_ROOT: /data/inbox
      # 3 OCR slots on a 16 GB Ryzen. Raise only after watching memory during a
      # large bundle — OCRmyPDF is the memory-hungry part of this system.
      WORKER_CONCURRENCY: "3"
      OCR_LANGUAGES: eng
      OCR_DESKEW: "true"
      OCR_CLEAN: "true"
      # Leave empty until you want classification. With no key the archive is
      # fully functional and classification simply defers (REQ-055) — that is
      # designed behaviour, not a broken state.
      ANTHROPIC_API_KEY: ""
      BINDERY_MODEL: claude-opus-5
      BINDERY_PROMPT_VERSION: v1
      BINDERY_HOSTNAME: bindery.d3cloud.io
    volumes:
      - /media/Main-Storage/bindery/data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/api/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    # Above the api lifespan's own drain, so the `finally` block that flushes
    # the last event_log rows actually runs — those are the lines most likely to
    # explain whatever you were mid-way through when you redeployed.
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
    # NOTE (REQ-114): migrations are NOT run here. Apply them explicitly.

  worker:
    image: ghcr.io/matdemers1/bindery/worker:main
    container_name: bindery-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *bindery-env
    volumes:
      - /media/Main-Storage/bindery/data:/data
    # The worker is the process that does the work, and its two bad days are
    # "hung" and "dead" — both of which leave the container reporting `Up` with
    # no logs, indistinguishable from a quiet Tuesday. `worker/runner.py` stamps
    # /tmp/bindery-worker.heartbeat every 15s from the pipeline's own event
    # loop, so a loop that has stopped turning stops stamping it and this goes
    # `unhealthy` within about three minutes.
    #
    # Marking it is all Docker will do: `restart: unless-stopped` acts on
    # process exit, not on health. See docs/zimaos-deploy.md, "when the worker
    # goes unhealthy", for how to make that actionable on this host.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; p='/tmp/bindery-worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 120 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    # Above runner.SHUTDOWN_GRACE_SECONDS (20s), or SIGKILL lands while the
    # worker is still waiting on in-flight tasks and it never reaches the block
    # that hands its claims back.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # OCR is the reason this box has 16 GB. Three concurrent OCRmyPDF
          # passes over a large scan is the peak this has to survive.
          memory: 8G

  web:
    image: ghcr.io/matdemers1/bindery/web:main
    container_name: bindery-web
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    deploy:
      resources:
        limits:
          memory: 256M

  cloudflared:
    # Pinned, like the four services above it. `--no-autoupdate` means the
    # binary never updates itself, so the tag is the only update path — and on
    # `:latest` an unrelated `docker compose pull` during any maintenance
    # silently swaps the process terminating the household's only ingress
    # (ADR-006, REQ-104), with no version recorded anywhere and nothing to roll
    # back to. It does need to stay reasonably current for tunnel protocol
    # compatibility: bump it deliberately, as a step in the deploy runbook.
    # See docs/zimaos-deploy.md, "Bumping cloudflared".
    image: cloudflare/cloudflared:2026.8.3
    container_name: bindery-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token change-me-cloudflare-tunnel-token
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 256M

x-casaos:
  architectures:
    - amd64
  main: web
  author: Demers Design and Development
  developer: matdemers1
  category: Documents
  title:
    en_us: Bindery
  tagline:
    en_us: Finds the document you can't find
  description:
    en_us: >-
      Self-hosted document archive. OCRs and indexes at the page level,
      decomposes bundled PDFs into their real constituent documents without
      modifying the original, and classifies with Claude against a taxonomy it
      already knows.
  # Deliberately not reachable from the LAN: ingress is the Cloudflare Tunnel,
  # and the app opens at its hostname rather than at the Zima's IP.
  scheme: https
  hostname: bindery.d3cloud.io
  index: /
  port_map: ""
  tips:
    before_install:
      en_us: >-
        Run `docker login ghcr.io` on this host first — the images are private.
        Create /media/Main-Storage/bindery/data and /DATA/AppData/bindery/pgdata. Replace every change-me
        value. After install, apply migrations explicitly:
        `docker exec bindery-api alembic upgrade head`.
