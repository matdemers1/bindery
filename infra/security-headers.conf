# Response headers for the open internet, in a file because nginx makes it a
# trap otherwise.
#
# **A level that declares any `add_header` inherits none from its parent.** So
# adding one `Cache-Control` to a `location` silently drops every header set on
# the `server` — which is exactly what happened when asset caching was added:
# CSP, HSTS, X-Frame-Options and four more vanished from `index.html` and every
# asset, on the login page of an origin that faces the open internet, and
# nothing failed. Any location block that sets a header of its own must
# `include` this file again.
#
# Cloudflare Access used to sit in front of everything here (ADR-008). With
# it gone, this origin answers the open internet directly, and these are
# the headers it was incidentally standing in for.
#
# `always` matters: without it nginx omits the header on error responses,
# which are exactly the pages an attacker is most likely to see.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

# HSTS. Cloudflare terminates TLS in front of the tunnel, so the browser
# only ever speaks HTTPS to this hostname — and once it has seen this
# header, downgrading it is not an option an attacker has. No `preload`:
# that is a one-way submission to a browser-vendor list, and this hostname
# may not always want it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The application is a Vite bundle serving its own assets from this origin,
# and Tailwind emits a style element, hence `unsafe-inline` for styles only.
# Scripts get no such allowance. `connect-src` includes wss: for the live
# updates socket; `frame-ancestors none` is the modern half of X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
