[project]
name = "bindery"
version = "0.1.0"
description = "Self-hosted document archive with page-level retrieval inside bundled PDFs"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "argon2-cffi",
    "pyjwt",
    "python-multipart",
    "anthropic",
    "ocrmypdf",
    "pikepdf",
    "pypdf",
    "pgvector",
    "watchfiles",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live_api: hits the real Claude API; excluded from the default run"]
addopts = "-m 'not live_api'"
