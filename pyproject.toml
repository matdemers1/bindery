[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bindery"
version = "0.1.0"
description = "Self-hosted document archive with page-level retrieval inside bundled PDFs"
requires-python = ">=3.13"

# Base = what `api` needs. The OCR toolchain lives in the `worker` extra so the
# api image does not carry it. infra/extract-deps.py reads these lists directly,
# so this file is the single source of truth for both images.
#
# Versions are NOT declared here, on purpose: `requirements.lock` pins the whole
# transitive closure and every pip install in this repository passes it as
# `-c requirements.lock`. This list answers "which packages", the lock answers
# "which versions". The only bounds written here are for the two libraries whose
# *observable behaviour* this code parses rather than calls — see below.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "argon2-cffi",
    "pyjwt",
    "python-multipart",
    "pgvector",
    # Known-form seed definitions (api/forms/seed/*.yaml), read by both images.
    "pyyaml",
    # Page extraction for segment export; also used by the pipeline.
    "pikepdf",
    # Encrypts secrets held in the settings table, and generates the TOTP
    # secrets and one-time codes in api/auth/ — `secrets` for the randomness,
    # this for the HMAC that turns it into a six-digit code.
    "cryptography",
    # The api needs it too: /api/settings/test-ai validates a key against the
    # live API, and Q&A (REQ-116) is a synchronous request, not a worker stage.
    #
    # Bounded to the major whose citations shape api/ask.py depends on. Q&A
    # refuses to answer without a citation, so a response schema that moved
    # under us would not degrade the feature, it would disable it.
    "anthropic>=1,<2",
    # AES-256 ZIP for the go-bag export. Standard enough that 7-Zip and Keka
    # open it, which is the point: the recipient may not have Bindery.
    "pyzipper",
    # Offsite replication (ADR-010). The repo prefers implementing to depending
    # — TOTP is forty lines of HMAC rather than a library — but SigV4 is not
    # that: canonical request construction, chunked payload signing and
    # multipart upload are each subtle, and a signing bug presents as an opaque
    # 403. The api needs it too, not only the worker: the connection test is a
    # synchronous request on a human's behalf, like /api/settings/test-ai.
    "boto3",
]

[project.optional-dependencies]
worker = [
    # Bounded to a major, unlike everything else here, because
    # worker/stages/normalize.py branches on OCRmyPDF's *exit codes* (6, 7, 10)
    # and on literal substrings of its stderr. Those are not API; a major that
    # renumbered or reworded them would not fail a build, it would silently
    # reclassify a failed scan as a success — in a pipeline whose invariant 8 is
    # that nothing fails silently.
    "ocrmypdf>=17,<18",
    "pypdf",
    "pillow",
    # HEIC/HEIF from an iPhone camera roll (REQ-006).
    "pillow-heif",
]
dev = [
    "pytest", "pytest-asyncio", "httpx", "ruff", "mypy",
    # Build real .docx/.xlsx fixtures: a stub would test nothing.
    "python-docx", "openpyxl",
]

[tool.setuptools.packages.find]
include = ["api*", "worker*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# B008 is FastAPI's dependency-injection idiom: Depends()/Form()/File() in a
# default is the documented way to declare them.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic's generated header sits above the imports by convention.
"alembic/versions/*" = ["E402"]
# Page ranges in the generated export HTML use a real en dash ("pp. 1–3"). It is
# typography in user-facing output, not an ambiguous identifier.
"api/export/archive_export.py" = ["RUF001"]
"tests/test_trust_and_export.py" = ["RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run. The async engine is module-level, so its
# connection pool would otherwise be bound to a loop that no longer exists.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "live_api: hits the real Claude API; excluded from the default run",
    "slow: seeds a large index or runs OCR; excluded from the default run",
]
addopts = "-m 'not live_api and not slow'"
