# Bindery — Python dependency lock. This is a pip *constraints* file.
#
# pyproject.toml stays the human-authored source of truth for *which* packages
# each image needs; this file fixes *which versions* it gets, for the whole
# transitive closure. Every pip install in this repository passes it as
# `-c requirements.lock`, so the api image still installs only the base set and
# the worker image still adds the OCR extra — they just both resolve to the
# versions recorded here. A constraint on a package that is not being installed
# is ignored, which is exactly what keeps one lock serving three different
# dependency groups.
#
# A dependency pinned by URL in pyproject.toml is deliberately absent from this file: pip
# refuses to resolve a direct reference that also appears as a constraint, and a URL carrying a
# commit and a hash is a stronger pin than a version line. `d3auth-client` is the one today.
#
# Regenerate with `make lock`. That freezes the versions out of the image that
# has just been built and passed, rather than resolving afresh against PyPI, so
# what is pinned is what was tested. Review the diff: a version moving here is a
# dependency upgrade, and this file is the one place it is visible.
#
# A brand-new transitive dependency — a package that appears for the first time
# because an upstream added it — is unconstrained until the next `make lock`.
# That is the residual float, and it is why `make lock` belongs in the same
# commit as any dependency change.
#
# No hashes, deliberately. Hashes are per-artifact, and this repository builds
# linux/arm64 images on a Mac and linux/amd64 images in CI; a hash set generated
# on one is an install failure on the other. Pinned versions are what make two
# builds of one commit the same software. `pip-audit` in CI's lint gate is what
# watches this set for advisories.
#
# Generated by `make lock` — do not edit by hand.
